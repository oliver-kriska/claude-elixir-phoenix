name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Markdown + YAML + JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml
          strict: false

      - name: Validate JSON
        run: |
          for file in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./.claude/*"); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null
          done

  python:
    name: Python Lint + Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml ruff pip-audit

      - name: Ruff lint (Python)
        run: ruff check lab/ scripts/ --select E,F,W --ignore E501,E402

      - name: Ruff format check
        run: ruff format --check lab/ scripts/ || true

      - name: Pip audit (security)
        run: pip-audit -r requirements.txt || true

  shell:
    name: Shell Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          find plugins/elixir-phoenix/hooks/scripts -name "*.sh" -exec shellcheck {} + || true
          find lab/autoresearch/scripts -name "*.sh" -exec shellcheck {} + || true
          shellcheck lab/eval/run_eval.sh || true

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev || true

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python3 -m pytest lab/eval/tests/ -v --tb=short

  eval:
    name: Skill & Agent Eval
    runs-on: ubuntu-latest
    needs: [lint, python, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Score all skills (8 dimensions)
        run: |
          python3 -m lab.eval.scorer --all 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          perfect = sum(1 for v in d.values() if v['composite'] >= 0.999)
          avg = sum(v['composite'] for v in d.values()) / len(d)
          fixable_failures = {}
          for name, data in d.items():
              if data['composite'] < 0.95:
                  all_behavioral = all(
                      dim == 'behavioral'
                      for dim, dd in data['dimensions'].items()
                      for a in dd['assertions'] if not a['passed']
                  )
                  if not all_behavioral:
                      fixable_failures[name] = round(data['composite'], 3)
          print(f'{len(d)} skills | {perfect} perfect | avg {avg:.3f}')
          if fixable_failures:
              print(f'FIXABLE FAILURES: {fixable_failures}')
              sys.exit(1)
          print('All skills pass (behavioral edge cases expected)')
          "

      - name: Score all agents (5 dimensions)
        run: |
          python3 -m lab.eval.agent_scorer --all 2>&1 | tee /dev/stderr | tail -1 | grep -q "perfect"

  port-validate:
    name: Multi-agent Port Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify targets/ matches port.py output
        run: python3 -m scripts.port --check

      - name: Codex description budget check
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          total = 0
          for skill_md in Path('targets/codex/skills').glob('*/SKILL.md'):
              import yaml
              text = skill_md.read_text()
              if not text.startswith('---'):
                  continue
              _, fm, _ = text.split('---', 2)
              data = yaml.safe_load(fm) or {}
              total += len((data.get('description') or '').encode('utf-8'))
          budget = 8000
          print(f'codex description budget: {total}/{budget} bytes')
          if total > budget:
              sys.exit(f'BUDGET EXCEEDED: {total} > {budget}')
          "

      - name: Iron Laws YAML consistency
        run: |
          # Read-only: assertions against `targets/codex/` (already drift-checked
          # above) and against `iron-laws/laws.yaml`. Does NOT mutate the working
          # tree — the previous version called `make port` mid-job which made
          # this step fragile if anything later expected the original state.
          python3 -c "
          import sys
          from pathlib import Path
          from scripts.port_lib.iron_laws import load_laws
          from scripts.port_lib.frontmatter import parse_file

          # 1. laws.yaml well-formed.
          laws = load_laws()
          assert len(laws) >= 22, f'expected >=22 laws, got {len(laws)}'
          for law in laws:
              for required in ('number', 'title', 'body', 'category'):
                  assert required in law, f'law {law.get(\"number\")} missing {required}'

          # 2. Auto-load reference skills in targets/codex have the inlined block.
          source_skills = Path('plugins/elixir-phoenix/skills')
          auto_load_source_names = {
              s.name for s in source_skills.iterdir()
              if s.is_dir() and ':' not in (parse_file(s / 'SKILL.md').data.get('name') or '')
          }

          missing = []
          for codex_skill in Path('targets/codex/skills').iterdir():
              if not codex_skill.is_dir():
                  continue
              if codex_skill.name in auto_load_source_names:
                  text = (codex_skill / 'SKILL.md').read_text()
                  if '## Iron Laws (Inlined)' not in text:
                      missing.append(codex_skill.name)

          if missing:
              sys.exit(f'Reference skills missing Iron Laws block in targets/codex/: {missing}')
          print(f'Iron Laws YAML: {len(laws)} laws, {len(auto_load_source_names)} auto-load skills, all inlined ✓')
          "

      - name: No source slash-command leakage in targets/codex
        run: |
          # Negative-form CI assertion: rewrite_slash_commands rewrites /phx:foo
          # to \$phx-foo for Codex. Test that NO old form remains anywhere in
          # the generated tree (SKILL.md bodies AND references/*.md).
          # Catches regressions of the same class as the B1 review finding.
          if grep -rE '/phx:[a-z-]+|/lv:[a-z-]+|/ecto:[a-z-]+' targets/codex/skills/ \
                --include='*.md' \
                | grep -v 'IRON-LAWS' >/tmp/leaks.txt 2>&1 && [ -s /tmp/leaks.txt ]; then
            echo "Found stale /phx:|/lv:|/ecto: command syntax in targets/codex/:"
            head -20 /tmp/leaks.txt
            exit 1
          fi
          echo "No source slash-command syntax leaked into targets/codex/ ✓"

      - name: Every Codex hook script is wired
        run: |
          # Catches the B2 class of bug: a script generated under
          # targets/codex/hooks/scripts/ but never referenced from hooks.json
          # ships as dead code (e.g. install-codex-agents.sh in the original
          # PR before review). Allow-list scripts that exist for documentation
          # or out-of-band invocation.
          python3 -c "
          import json, sys
          from pathlib import Path
          hooks_json = json.loads(Path('targets/codex/hooks/hooks.json').read_text())
          referenced = set()
          for ev_configs in (hooks_json.get('hooks') or {}).values():
              for cfg in ev_configs:
                  for h in cfg.get('hooks', []):
                      cmd = h.get('command', '')
                      for token in cmd.split('/'):
                          if token.endswith('.sh'):
                              referenced.add(token)
          shipped = {p.name for p in Path('targets/codex/hooks/scripts').glob('*.sh')}
          # Allow-list: scripts that are intentionally not auto-fired (none today).
          allow = set()
          orphans = (shipped - referenced) - allow
          if orphans:
              sys.exit(f'Codex ships dead scripts (no hooks.json reference): {sorted(orphans)}')
          print(f'All {len(shipped)} Codex hook scripts wired into hooks.json ✓')
          "

      - name: Agent count parity (source vs targets/codex)
        run: |
          # Catches silent agent-loss: source has N agents, builder must emit N TOMLs.
          # If the source gains an agent and the builder skips it (parse error
          # swallowed, name collision, etc.), this trips before the mirror publishes.
          python3 -c "
          import sys
          from pathlib import Path
          source_count = len(list(Path('plugins/elixir-phoenix/agents').glob('*.md')))
          target_count = len(list(Path('targets/codex/agents-toml').glob('*.toml')))
          if source_count != target_count:
              sys.exit(
                  f'Agent count mismatch: source has {source_count} .md files, '
                  f'targets/codex/agents-toml has {target_count} .toml files'
              )
          print(f'Agent count parity: {source_count} source ↔ {target_count} codex ✓')
          "
