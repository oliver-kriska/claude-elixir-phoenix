name: Publish target mirrors

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target mirror to publish"
        required: true
        type: choice
        options:
          - all
          - pi
          - opencode

concurrency:
  group: publish-mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.target }} mirror push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pi, opencode]
    steps:
      - name: Skip if not selected (workflow_dispatch)
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.target != 'all'
          && github.event.inputs.target != matrix.target
        run: |
          echo "Skipping ${{ matrix.target }} (selected: ${{ github.event.inputs.target }})"
          exit 0

      - name: Checkout (with full history for subtree split)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify targets/ are up to date
        run: python3 -m scripts.port --check

      - name: Run full CI gate before publishing mirrors
        run: |
          # Tag pushes can bypass main-branch CI (e.g. a tag pushed to a
          # feature branch), so we re-run the full eval gate here. Without
          # this, a broken release tag could publish broken content to the
          # `pi-elixir-phoenix` and `opencode-elixir-phoenix` mirror repos.
          # Reuses the same eval target as the lint workflow.
          pip install -r requirements.txt
          make eval-ci

      - name: Configure git identity
        run: |
          git config user.name "phxagents-bot"
          git config user.email "noreply@phxagents.dev"

      - name: Publish ${{ matrix.target }}
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          MIRROR_REPO: ${{ matrix.target == 'pi' && 'pi-elixir-phoenix' || 'opencode-elixir-phoenix' }}
        run: |
          # Reconfigure remote to use the mirror PAT.
          REMOTE_URL="https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/oliver-kriska/${MIRROR_REPO}.git"
          python3 -m scripts.publish --target ${{ matrix.target }} --remote "$REMOTE_URL"
