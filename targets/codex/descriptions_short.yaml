# Codex skill description overrides.
#
# Codex's plugin manifest has an 8 KB ceiling on the sum of `description:`
# fields across all skills. The current sum is well under (7612/8000), but
# this file lets us tighten any single skill's description without editing
# the canonical SKILL.md.
#
# Format:
#   <normalized-skill-name>: "shorter description"
#
# Example:
#   phx-plan: "Plan multi-domain Phoenix features."
#
# The port pipeline (scripts/port_lib/codex.py) reads this map and replaces
# `description:` in the generated `targets/codex/skills/<name>/SKILL.md`.
# If a key is missing, the canonical description is used unchanged.

# v3.0.0: deps-audit + deps-vet (merged from main's 2.9.0) pushed the
# canonical sum to 8036/8000. These two overrides bring it back under
# budget while keeping the routing keywords.
# Folded scalars keep these under yamllint's 120-char line limit; the
# parsed value is a single space-joined string. Overrides bypass the
# slash-rewrite, so write the bare skill name (`phx-deps-audit`) — never
# `/phx:…` (the CI leak assertion forbids source-form slash commands in
# targets/codex) and never `$phx-…` (Codex has no `$` command
# invocation; skills auto-load by description).
phx-deps-audit: >-
  Audit Hex deps for supply-chain risk — bidi, compile-time exec,
  typosquats, CVEs. Use after mix deps.update or on mix.lock diffs.
phx-deps-vet: >-
  Record a vetted Hex package in hex_vet.exs after a security review.
  Use to approve a dep after phx-deps-audit findings.

# v3.0.0 post-main-merge: main's 2.11.0 added ash-framework + freeze,
# pushing the canonical sum to 8224/8000. Four more overrides restore
# the margin while keeping each skill's routing keywords.
ash-framework: >-
  Ash Framework — resources, actions, policies, aggregates,
  calculations, AshPhoenix.Form. Use when running mix ash.codegen or
  editing Ash resources, domains, or code interfaces.
freeze: >-
  Freeze or scope which files can be edited — read-only investigate
  lock or keep a refactor inside specific dirs. Sentinel + PreToolUse
  hook.
oban: >-
  Oban jobs — workers, perform/1, process/1, queues, cron, retries,
  unique jobs, idempotency, Oban Pro, testing. Use when writing
  workers, queue config, or debugging jobs.
phx-full: >-
  Run the full plan-implement-review-compound cycle with specialist
  agents and Iron Laws. Use for large features spanning multiple
  contexts or autonomous end-to-end implementation.
liveview-patterns: >-
  Build LiveView — assign_async, PubSub (check connected?), phx-change
  events, forms, modals, uploads, streams, live_patch. Use for
  interactions, events, or Presence.
lv-assigns: >-
  Inspect LiveView socket assigns for memory bloat — missing
  temporary_assigns, unbounded lists needing streams. Use when
  LiveView memory grows.
